# Builds the backend image, pushes it to GHCR and restarts it on the VPS.
# The job fails unless the new container passes its Compose health check.
name: Deploy
on:
  push:
    branches: [main]
    # The client deploys to Vercel; only rebuild the API image when something it contains changes.
    # client/package.json is listed because the root lockfile (and so the image build) depends on it.
    paths:
      - server/**
      - shared/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - client/package.json
      - Dockerfile
      - .dockerignore
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never run two deploys at once; a newer push supersedes one that's still queued.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/versus-api:latest
            ghcr.io/${{ github.repository_owner }}/versus-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh "deploy@$DEPLOY_HOST" "cd ~/app && docker compose pull versus-api && docker compose up -d --wait --wait-timeout 90 versus-api && docker image prune -f"
